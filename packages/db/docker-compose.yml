name: dispatch

services:
  database:
    image: postgis/postgis:16-3.4
    container_name: db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./init:/docker-entrypoint-initdb.d
